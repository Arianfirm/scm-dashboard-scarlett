<script>
const CSV_KPI  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2NdMlschNnkdEjXjN_OO4vkbb6mdmhqBb7j0iSn77LTumByCFeNYoJcdA7fxhdp1rwGhkhCdO56Sw/pub?gid=1726885858&single=true&output=csv';
const CSV_MP   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2NdMlschNnkdEjXjN_OO4vkbb6mdmhqBb7j0iSn77LTumByCFeNYoJcdA7fxhdp1rwGhkhCdO56Sw/pub?gid=1508996446&single=true&output=csv';
const CSV_PROD = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2NdMlschNnkdEjXjN_OO4vkbb6mdmhqBb7j0iSn77LTumByCFeNYoJcdA7fxhdp1rwGhkhCdO56Sw/pub?gid=747219576&single=true&output=csv';
const CSV_CAT  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2NdMlschNnkdEjXjN_OO4vkbb6mdmhqBb7j0iSn77LTumByCFeNYoJcdA7fxhdp1rwGhkhCdO56Sw/pub?gid=971208042&single=true&output=csv';

let D = {kpi:[], mp:[], prod:[], cat:[]};

const toN = v => { if(!v && v !== 0) return 0; return parseFloat(String(v).replace(/[^0-9.-]/g,'')) || 0; };
const fmt = v => Math.round(v).toLocaleString('id-ID');

function findCol(data, keywords) {
  if(!data?.length) return null;
  const cols = Object.keys(data[0]);
  for (let kw of keywords) {
    const found = cols.find(c => c.toLowerCase().replace(/[\s_-]/g,'').includes(kw.toLowerCase().replace(/[\s_-]/g,'')));
    if (found) return found;
  }
  return null;
}

async function fetchCSV(url) {
  return new Promise((res, rej) => Papa.parse(url, {
    download: true, 
    header: true, 
    skipEmptyLines: true, 
    complete: r => res(r.data), 
    error: rej
  }));
}

// ================== RENDER KPI CEPAT ==================
function renderKPI() {
  const rows = D.kpi;
  if (!rows.length) return;

  const wkCol = findCol(rows, ['week','minggu','wk']) || Object.keys(rows[0])[0];
  const allWeeks = [...new Set(rows.map(r => r[wkCol]).filter(Boolean))].sort((a,b) => toN(a) - toN(b));

  // Fill dropdown
  const weekSelect = document.getElementById('kpiWeek');
  weekSelect.innerHTML = `<option value="all">Semua Week</option>`;
  allWeeks.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = `Wk ${w}`;
    weekSelect.appendChild(opt);
  });

  const fWk = weekSelect.value;
  const latestWk = allWeeks[allWeeks.length-1];
  const displayWk = fWk === 'all' ? latestWk : fWk;

  const filtered = fWk === 'all' ? rows : rows.filter(r => String(r[wkCol]) === String(displayWk));

  // Hitung sekali saja
  const val = {
    total: filtered.reduce((s,r) => s + toN(r[findCol(rows,['total','order','grand'])]), 0),
    delivered: filtered.reduce((s,r) => s + toN(r[findCol(rows,['delivered','terkirim','success'])]), 0),
    dispatched: filtered.reduce((s,r) => s + toN(r[findCol(rows,['dispatched','dikirim'])]), 0),
    cancelled: filtered.reduce((s,r) => s + toN(r[findCol(rows,['cancelled','dibatalkan'])]), 0),
    return: filtered.reduce((s,r) => s + toN(r[findCol(rows,['return','retur'])]), 0),
    wh: filtered.reduce((s,r) => s + toN(r[findCol(rows,['wh','warehouse','gudang'])]), 0),
    system: filtered.reduce((s,r) => s + toN(r[findCol(rows,['system','sys'])]), 0),
    expedisi: filtered.reduce((s,r) => s + toN(r[findCol(rows,['expedisi','ekspedisi'])]), 0)
  };

  const totalBase = val.total || 1;

  const html = `
    <div class="kpi-matrix-card">
      <div class="matrix-header">${fWk === 'all' ? `Wk ${latestWk} (Latest)` : `Wk ${displayWk}`}</div>
      <table class="matrix-table">
        <thead>
          <tr>
            <th></th>
            <th>TOTAL</th>
            <th>Delivered</th>
            <th>Dispatched</th>
            <th>Cancelled</th>
            <th>Return</th>
            <th>WH Issue</th>
            <th>System Issue</th>
            <th>Expedisi Issue</th>
          </tr>
        </thead>
        <tbody>
          <tr class="row-order">
            <td class="row-label">ORDER</td>
            <td class="num highlight">${fmt(val.total)}</td>
            <td class="num">${fmt(val.delivered)}</td>
            <td class="num">${fmt(val.dispatched)}</td>
            <td class="num">${fmt(val.cancelled)}</td>
            <td class="num">${fmt(val.return)}</td>
            <td class="num">${fmt(val.wh)}</td>
            <td class="num">${fmt(val.system)}</td>
            <td class="num">${fmt(val.expedisi)}</td>
          </tr>
          <tr class="row-qty">
            <td class="row-label">QUANTITY</td>
            <td class="num highlight">${fmt(val.total)}</td>
            <td class="num">${fmt(val.delivered)}</td>
            <td class="num">${fmt(val.dispatched)}</td>
            <td class="num">${fmt(val.cancelled)}</td>
            <td class="num">${fmt(val.return)}</td>
            <td class="num">${fmt(val.wh)}</td>
            <td class="num">${fmt(val.system)}</td>
            <td class="num">${fmt(val.expedisi)}</td>
          </tr>
          <tr class="row-percent">
            <td class="row-label">% to TOTAL</td>
            <td class="num highlight">100%</td>
            <td class="num">${(val.delivered/totalBase*100).toFixed(1)}%</td>
            <td class="num">${(val.dispatched/totalBase*100).toFixed(1)}%</td>
            <td class="num">${(val.cancelled/totalBase*100).toFixed(1)}%</td>
            <td class="num">${(val.return/totalBase*100).toFixed(1)}%</td>
            <td class="num">${(val.wh/totalBase*100).toFixed(1)}%</td>
            <td class="num">${(val.system/totalBase*100).toFixed(1)}%</td>
            <td class="num">${(val.expedisi/totalBase*100).toFixed(1)}%</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('kpiContent').innerHTML = html;
  document.getElementById('kpiStatus').textContent = `${allWeeks.length} weeks · Wk ${latestWk} latest`;
}

// NAV
function showPage(p, el) {
  document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  el.classList.add('active');
  if(p === 'kpi') renderKPI();
}

// INIT
async function init() {
  try {
    const [kpi] = await Promise.all([fetchCSV(CSV_KPI)]);
    D.kpi = kpi;
    document.getElementById('lastSync').textContent = new Date().toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
    renderKPI();
  } catch(e) {
    document.getElementById('kpiContent').innerHTML = `<div class="error-state">Gagal memuat data</div>`;
  }
}
init();
</script>
