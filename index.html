<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCM Dashboard — Scarlett</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<!-- TAMBAHAN UNTUK % PIE CHART -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f0eef8;
  --card:#fff;
  --border:#e2daf2;
  --text:#1a0a2e;
  --text2:#6b5b8a;
  --green:#1D9E75;
  --blue:#5b3fa8;
  --orange:#e6944a;
  --red:#e05b5b;
  --pink:#e879a0;
}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  padding:24px;
}

.chart-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.chart-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:16px;
}

.chart-wrap{
  position:relative;
  height:500px;
}
</style>
</head>

<body>

<div class="chart-card">

  <div class="chart-title">
    🏷️ Komposisi per Category
  </div>

  <div class="chart-wrap">
    <canvas id="catPie"></canvas>
  </div>

</div>

<script>

// =============================
// DUMMY DATA
// =============================

const sc = [
  'BODY CARE',
  'FACE CARE',
  'HAIR CARE',
  'OTHERS',
  'PERFUME'
];

const pieData = [
  12000,
  8500,
  2200,
  1300,
  34000
];

const COLORS = [
  '#5b3fa8',
  '#e879a0',
  '#1D9E75',
  '#e6944a',
  '#e05b5b'
];

// =============================
// FORMAT NUMBER
// =============================

function fmt(v){

  if(v >= 1000000){
    return (v/1000000).toFixed(1)+'jt';
  }

  return Math.round(v).toLocaleString('id-ID');
}

// =============================
// PIE CHART
// =============================

new Chart(document.getElementById('catPie'), {

  type: 'doughnut',

  data: {

    labels: sc,

    datasets: [{

      data: pieData,

      backgroundColor: COLORS.map(c => c + 'dd'),

      borderColor: '#ffffff',

      borderWidth: 3,

      hoverOffset: 12
    }]
  },

  plugins: [ChartDataLabels],

  options: {

    responsive: true,

    maintainAspectRatio: false,

    cutout: '45%',

    layout:{
      padding:20
    },

    plugins: {

      // =============================
      // LEGEND
      // =============================

      legend: {

        position: 'right',

        labels: {

          boxWidth: 14,

          padding:18,

          font: {
            size: 12,
            weight:'600'
          }
        }
      },

      // =============================
      // TOOLTIP
      // =============================

      tooltip: {

        backgroundColor:'#1e0d3b',

        padding:12,

        callbacks: {

          label: function(context) {

            const total =
              context.dataset.data.reduce((a,b)=>a+b,0);

            const value = context.raw;

            const percentage =
              ((value / total) * 100).toFixed(1);

            return `${context.label}: ${fmt(value)} (${percentage}%)`;
          }
        }
      },

      // =============================
      // PERCENT TEXT
      // =============================

      datalabels: {

        color: '#ffffff',

        font: {

          weight: 'bold',

          size: 14
        },

        formatter: (value, ctx) => {

          const total =
            ctx.chart.data.datasets[0].data
            .reduce((a,b)=>a+b,0);

          const percentage =
            (value / total * 100).toFixed(1);

          // sembunyikan kalau terlalu kecil
          if (percentage < 3) return '';

          return percentage + '%';
        }
      }
    },

    animation: {

      animateRotate: true,

      duration: 1200
    }
  }
});

</script>

</body>
</html>
