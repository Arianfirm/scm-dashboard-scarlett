<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCM Dashboard — Scarlett</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<!-- PLUGIN PERCENT PIE -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f2fb;
  padding:30px;
}

.chart-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  border:1px solid #ddd;
}

.chart-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:20px;
}

.chart-wrap{
  position:relative;
  height:500px;
}
</style>
</head>

<body>

<div class="chart-card">

  <div class="chart-title">
    🏷️ Komposisi per Category
  </div>

  <div class="chart-wrap">
    <canvas id="catPie"></canvas>
  </div>

</div>

<script>

// ==========================
// SAMPLE DATA
// ==========================

const sc = [
  'BODY CARE',
  'FACE CARE',
  'HAIR CARE',
  'OTHERS',
  'PERFUME'
];

const pieData = [
  12000,
  8500,
  2200,
  1300,
  34000
];

const COLORS = [
  '#5b3fa8',
  '#e879a0',
  '#1D9E75',
  '#e6944a',
  '#e05b5b'
];

// ==========================
// FORMAT NUMBER
// ==========================

function fmt(v){

  if(v >= 1000000){
    return (v/1000000).toFixed(1)+'jt';
  }

  return Math.round(v).toLocaleString('id-ID');
}

// ==========================
// PIE CHART
// ==========================

new Chart(document.getElementById('catPie'), {

  type: 'doughnut',

  data: {

    labels: sc,

    datasets: [{

      data: pieData,

      backgroundColor: COLORS.map(c => c + 'dd'),

      borderColor: '#ffffff',

      borderWidth: 4,

      hoverOffset: 12

    }]
  },

  plugins: [ChartDataLabels],

  options: {

    responsive: true,

    maintainAspectRatio: false,

    cutout: '45%',

    layout:{
      padding:20
    },

    plugins: {

      // ==========================
      // LEGEND
      // ==========================

      legend: {

        position: 'right',

        labels: {

          boxWidth: 16,

          padding:20,

          font: {
            size: 13,
            weight:'600'
          }
        }
      },

      // ==========================
      // TOOLTIP
      // ==========================

      tooltip: {

        backgroundColor:'#1e0d3b',

        padding:12,

        titleFont:{
          size:13
        },

        bodyFont:{
          size:12
        },

        callbacks: {

          label: function(context) {

            const total = context.dataset.data
              .reduce((a, b) => a + b, 0);

            const value = context.raw;

            const percentage =
              ((value / total) * 100).toFixed(1);

            return ` ${context.label}: ${fmt(value)} (${percentage}%)`;
          }
        }
      },

      // ==========================
      // PERCENT LABEL
      // ==========================

      datalabels: {

        color: '#ffffff',

        font: {
          weight: 'bold',
          size: 14
        },

        formatter: (value, ctx) => {

          const total =
            ctx.chart.data.datasets[0].data
            .reduce((a, b) => a + b, 0);

          const percentage =
            (value / total * 100).toFixed(1);

          // hide kalau kecil
          if (percentage < 3) {
            return '';
          }

          return percentage + '%';
        }
      }
    },

    animation: {

      animateRotate: true,

      duration: 1400
    }
  }
});

</script>

</body>
</html>
